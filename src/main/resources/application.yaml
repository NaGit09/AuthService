spring:
  application:
    name: AuthService

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:auth-service-group}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${JWT_PUBLIC}

  devtools:
    add-properties: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
    show-sql: true

auth:
  jwt:
    issuer: ${JWT_ISS}
    private-key-location: file:${JWT_PRIVATE}
    access-expiration: ${JWT_ACCESS_EXPIRATION}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION}
    algorithm: ${JWT_ALGORITHM}

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

logging:
  level:
    root: info
    "[org.springframework.web]": debug
    "[org.springframework.security]": DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    config-url: /api/v1/furniro/auth-service/v3/api-docs/swagger-config
    url: /api/v1/furniro/auth-service/v3/api-docs
    disable-swagger-default-url: true
